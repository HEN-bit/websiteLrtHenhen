        <div class="nav-right">
            <div id="userBox" class="userBox" onclick="toggleUserMenu(event)"></div>

            <div id="userDropdown" class="user-dropdown">
                <div id="dropdownEmail" class="dropdown-header"></div>
                <a href="dashboard.html">📊 Dashboard</a>
                <a href="#" onclick="logoutUser()">🚪 Logout</a>
            </div>
            <div id="menuIcon" onclick="toggleMenu()">☰</div>
        </div>

        <div class="nav-menu" id="navMenu">
            <a href="index.html" onclick="closeMenu()">Home</a>
            <a href="booking.html" onclick="closeMenu()">Pesan Tiket</a>
            <a href="cek.html" onclick="closeMenu()">Cek Transaksi</a>

        </div>

    </nav>

    <!-- CONTENT -->
    <section class="dashboard">

        <h1 style="text-align:center;">🎫 Tiket Saya</h1>

        <!-- 🔍 SEARCH & FILTER -->
        <div style="text-align:center; margin-bottom:20px;">

            <input type="text" id="searchInput" placeholder="Cari ID tiket..." onkeyup="loadTickets()"
                style="padding:8px; width:200px;">

            <select id="filterAsal" onchange="loadTickets()" style="padding:8px;">
                <option value="">Semua Asal</option>
                <option value="Bandara">Bandara</option>
                <option value="Asrama Haji">Asrama Haji</option>
                <option value="Punti Kayu">Punti Kayu</option>
                <option value="Garuda Dempo">Garuda Dempo</option>
                <option value="Demang">Demang</option>
                <option value="Bumi Sriwijaya">Bumi Sriwijaya</option>
                <option value="Dishub">Dishub</option>
                <option value="Cinde">Cinde</option>
                <option value="Ampera">Ampera</option>
                <option value="Polresta">Polresta</option>
                <option value="Jakabaring">Jakabaring</option>
            </select>

            <select id="filterTujuan" onchange="loadTickets()" style="padding:8px;">
                <option value="">Semua Tujuan</option>
                <option value="Bandara">Bandara</option>
                <option value="Asrama Haji">Asrama Haji</option>
                <option value="Punti Kayu">Punti Kayu</option>
                <option value="Garuda Dempo">Garuda Dempo</option>
                <option value="Demang">Demang</option>
                <option value="Bumi Sriwijaya">Bumi Sriwijaya</option>
                <option value="Dishub">Dishub</option>
                <option value="Cinde">Cinde</option>
                <option value="Ampera">Ampera</option>
                <option value="Polresta">Polresta</option>
                <option value="Jakabaring">Jakabaring</option>
            </select>

        </div>

        <!-- LIST TIKET -->
        <div id="ticketContainer" class="ticket-container"></div>

    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script src="java.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            loadTickets();
            cekUserNavbar();
        });
    </script>

</body>

</html>
